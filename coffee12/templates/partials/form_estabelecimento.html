{% load cafe_tags %}
<form method="post" class="painel formulario" novalidate>
  {% csrf_token %}
  {% campo form.nome %}
  {% campo form.endereco %}
  <div class="row g-2">
    <div class="col-sm-5">{% campo form.telefone %}</div>
    <div class="col-sm-7">{% campo form.descricao_horario %}</div>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit">{{ texto_botao }}</button>
    <a class="btn btn-link" href="{% url 'homepagecafe' %}">Cancelar</a>
  </div>
</form>
